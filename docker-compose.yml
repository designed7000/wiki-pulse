# The x-airflow-common anchor 
x-airflow-common:
  &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.3.0}
  env_file:
    - ${ENV_FILE_PATH:-.env}
  environment:
    &airflow-common-env
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    # Container-to-container, so the internal port stays 8080 regardless of host mapping
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-airflow_jwt_secret}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER:-airflow}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # DAGs reference this by name ("wikipulse") — no credentials in DAG files
    AIRFLOW_CONN_WIKIPULSE: postgresql://wiki:wiki@db:5432/wikipulse
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
    PYTHONPATH: /opt/airflow/src
  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
    - ${AIRFLOW_PROJ_DIR:-.}/src:/opt/airflow/src
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    airflow-db:
      condition: service_healthy

services:
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment: # This maps to a Kafka broker setting
      KAFKA_NODE_ID: 1 # We got 1 broker
      KAFKA_PROCESS_ROLES: broker,controller # KRaft mode that stores both messages and cluster metadata
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093 # container setting
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092 # address for clients to use when connecting
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT # tells kafka what protocol each listener uses, no encryption due to local dev
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER # tells kafka which listener is the controller one
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT # which listener brokers use to talk to each other
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093 # list of controllers and their addresses
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1 # tracks consumer progress
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk # a fixed ID stamped into kafka storage on first boot, to know it belongs to this cluster
      # In short: node/controller = who this broker is and how it talks to itself;
      # listeners = where it accepts connections; advertised listeners = what address it gives out to clients; offsets/cluster ID = bookkeeping so it can start up.
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092 # internal listener — kafka:9092 would advertise back localhost and fail
      LOGGING_LEVEL_ROOT: WARN
    depends_on:
      - kafka

  # A job: create the Kafka topics before anything tries to use them.
  # it could create them automatically but it's unreliable
  # So instead, you run a small Python script that explicitly
  # creates the topics you need (wiki-edits), then exits.
  init:
    build: .
    depends_on:
      kafka:
        condition: service_healthy
    command: ["python", "-m", "wiki_pulse.init"]
    restart: "no"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPICS: wiki-edits

  producer:
    build: .
    depends_on:
      init:
        condition: service_completed_successfully
    command: ["python", "-m", "wiki_pulse.producer"]
    restart: "always"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: wiki-edits

  consumer:
    build: .
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    command: ["python", "-m", "wiki_pulse.consumer"]
    restart: on-failure
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: wiki-edits
      POSTGRES_DSN: postgresql://wiki:wiki@db:5432/wikipulse

  db:
    image: postgres:16.4
    container_name: postgres
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: wiki
      POSTGRES_PASSWORD: wiki
      POSTGRES_DB: wikipulse
    # container's filesystem is disposable and dies with it. 
    # We need volumes to store outside the container so everytime we dispose 
    # the container, the data keep living and dont get deleted as well
    # OR use the volumes to map a file from your pc into the container
    volumes: 
      - pg_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro # :ro stands for read-only, so container cannot modify the source file
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiki -d wikipulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4.8.1
    restart: always
    ports:
      - 8081:8080

  # --- Airflow ---
  # Airflow's own metadata database — separate from wikipulse so its
  # bookkeeping never mixes with pipeline data.
  airflow-db:
    image: postgres:16.4
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # The web UI. Called api-server in Airflow 3.x, webserver in 2.x.
  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8082:8080"   # 8080 and 8081 are taken by kafka-ui and adminer
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # Parses DAG files. A separate component in Airflow 3.x.
  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # One-shot: runs DB migrations, creates the admin user, fixes volume ownership.
  # The _AIRFLOW_* vars below drive the entrypoint; the command only handles dirs.
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/{logs,dags,plugins}
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/
        /entrypoint airflow db migrate
        /entrypoint airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME:-airflow}" \
          --password "${_AIRFLOW_WWW_USER_PASSWORD:-airflow}" \
          --firstname Admin --lastname User --role Admin --email admin@example.com \
          || true
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    user: "0:0"   # needs root to chown the mounted volumes

volumes:
  kafka_data:
  pg_data:
  airflow_db_data: